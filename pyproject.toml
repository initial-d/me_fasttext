[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meft-memory"
version = "0.4.0"
description = "NGramStore: a general-purpose backend for learned n-gram embeddings, with compression, storage and exact lookup"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.urls]
Repository = "https://github.com/initial-d/ngram-store"

[project.optional-dependencies]
torch = ["torch", "numpy"]
tinyengram = ["torch", "numpy", "sympy", "loguru", "transformers==4.57.3", "tokenizers==0.22.2", "safetensors==0.7.0"]

[project.scripts]
ngram-store = "ngram_store.cli:main"
meft-fasttext-export = "meft_memory._runtime.fasttext_native_bundle:main"
meft-tiny-export = "meft_memory._runtime.tinyengram_checkpoint:main"
meft-tiny-verify = "meft_memory._runtime.verify_tinyengram_checkpoint:main"
meft-tiny-verify-device = "meft_memory._runtime.verify_tinyengram_device:main"
meft-tiny-train-reference = "meft_memory._runtime.train_tinyengram_reference:main"

[tool.setuptools]
packages = ["ngram_store", "meft_memory", "meft_memory._runtime"]
package-dir = {"meft_memory._runtime" = "tools"}
