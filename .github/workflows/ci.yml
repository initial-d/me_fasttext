name: CI

on:
  push:
  pull_request:

jobs:
  python-tools:
    name: Python tool tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python -m unittest discover -s tests

  torch-adapter:
    name: PyTorch gather adapter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU PyTorch
        run: |
          python -m pip install numpy
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify adapter and row storage
        run: python -m unittest discover -s tests

  native-sanitizers:
    name: Native C sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check native ABI and malformed files
        run: python tools/check_native_sanitizers.py
