name: CI

on:
  push:
  pull_request:

jobs:
  python-tools:
    name: Python tool tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run unit tests
        run: python -m unittest discover -s tests
